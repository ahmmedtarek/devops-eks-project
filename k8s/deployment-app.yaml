apiVersion: apps/v1
kind: Deployment

metadata:
  name: app
  labels:
    app: app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app
          image: 305018987435.dkr.ecr.eu-north-1.amazonaws.com/app:97
          ports:
            - containerPort: 5000
